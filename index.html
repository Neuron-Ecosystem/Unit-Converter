<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="google-site-verification" content="S4yj26laybYjHTBWA5u_2ey7dSgZ4F_5I22864VlCMU" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Converter | Neuron Ecosystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f0f23;
            --card-bg: #1a1b2e;
            --text: #ffffff;
            --text-secondary: #a0a0c0;
            --accent: #8b5cf6;
            --error: #ef4444;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .auth-header { position: absolute; top: 1rem; right: 1rem; z-index: 100; display: flex; align-items: center; gap: 10px; }
        .auth-btn {
            background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem;
            border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 0.5rem; text-decoration: none;
        }
        .auth-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        #user-info { display: none; align-items: center; gap: 0.8rem; background: rgba(255,255,255,0.05); padding: 0.4rem 0.8rem; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--primary); }
        .user-name-text { font-size: 0.9rem; font-weight: 500; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--card-bg); padding: 2rem; border-radius: 20px;
            width: 90%; max-width: 400px; position: relative; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .close-modal { position: absolute; top: 1rem; right: 1rem; color: var(--text-secondary); cursor: pointer; font-size: 1.5rem; }
        .auth-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .auth-tab { padding: 0.5rem 1rem; cursor: pointer; color: var(--text-secondary); transition: 0.3s; }
        .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .google-login-btn {
            width: 100%; padding: 0.8rem; background: white; color: #000; border: none;
            border-radius: 8px; margin-bottom: 1rem; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 0.5rem; font-weight: 600;
        }
        .auth-divider { text-align: center; margin: 1rem 0; color: var(--text-secondary); font-size: 0.8rem; }

        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; padding-top: 4rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .logo { font-size: 4rem; margin-bottom: 1rem; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .nav-btn {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px;
            padding: 2rem; text-align: center; cursor: pointer; transition: all 0.3s ease;
            text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; gap: 1rem;
        }
        .nav-btn:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3); }
        .nav-icon { font-size: 2.5rem; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .converter-section { background: var(--card-bg); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid rgba(255,255,255,0.1); display: none; }
        .section-active { display: block; animation: fadeInUp 0.5s ease; }

        input, select { width: 100%; padding: 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; margin-top: 10px; font-size: 1rem; }
        .convert-btn { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin: 20px 0; font-size: 1.1rem; }
        .result { background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 15px; text-align: center; font-size: 1.3rem; border: 1px dashed rgba(255,255,255,0.2); }

        .history-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .history-item {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px;
            border-left: 4px solid var(--primary); display: flex; justify-content: space-between; align-items: center;
        }
        .history-info strong { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; }
        .history-info p { margin-top: 4px; font-size: 1.1rem; }
        .history-date { font-size: 0.75rem; color: var(--text-secondary); }

        .footer { text-align: center; margin-top: 4rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); }
        .made-by { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 1rem; }
        .made-by a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .telegram-link { color: #24A1DE; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="auth-header">
        <button id="login-trigger" class="auth-btn"><i class="fas fa-user-circle"></i> Вход / Регистрация</button>
        <div id="user-info">
            <img src="" id="user-avatar" class="user-avatar">
            <span id="user-name" class="user-name-text"></span>
            <button id="logout-btn" class="auth-btn" style="padding: 0.4rem; background: transparent; border: 1px solid rgba(255,255,255,0.2);"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <div class="auth-tabs"><div class="auth-tab active" id="tab-login">Вход</div><div class="auth-tab" id="tab-register">Регистрация</div></div>
            <button class="google-login-btn" id="google-auth"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google</button>
            <div class="auth-divider">или Email</div>
            <input type="email" id="auth-email" placeholder="Email"><input type="password" id="auth-password" placeholder="Пароль">
            <button class="convert-btn" id="submit-auth">Войти</button>
            <div id="auth-error" class="error-msg" style="color: var(--error); display:none; text-align: center; margin-top:10px;"></div>
        </div>
    </div>

    <div class="container">
        <div id="main-menu">
            <div class="header">
                <div class="logo"><i class="fas fa-exchange-alt"></i></div>
                <h1>Neuron Converter</h1>
            </div>
            <div class="nav-buttons">
                <div class="nav-btn" onclick="showSection('currency')"><i class="fas fa-money-bill-wave nav-icon"></i><span>Валюты</span></div>
                <div class="nav-btn" onclick="showSection('units')"><i class="fas fa-ruler-combined nav-icon"></i><span>Единицы</span></div>
                <div class="nav-btn" onclick="showSection('history')"><i class="fas fa-history nav-icon"></i><span>История</span></div>
                <a href="http://neuron-p2p.ru/" class="nav-btn"><i class="fas fa-external-link-alt nav-icon"></i><span>Экосистема</span></a>
            </div>
        </div>

        <div id="currency-converter" class="converter-section">
            <button class="auth-btn" onclick="showMainMenu()"><i class="fas fa-chevron-left"></i> Назад</button>
            <h2>Валюты</h2>
            <input type="number" id="amount" value="100">
            <select id="from-currency"></select><select id="to-currency"></select>
            <button class="convert-btn" id="convert-btn">Конвертировать</button>
            <div id="result" class="result">Результат</div>
        </div>

        <div id="units-converter" class="converter-section">
            <button class="auth-btn" onclick="showMainMenu()"><i class="fas fa-chevron-left"></i> Назад</button>
            <h2>Единицы (Длина)</h2>
            <input type="number" id="unit-amount" value="1">
            <select id="from-unit"><option value="m">Метры</option><option value="km">Километры</option></select>
            <select id="to-unit"><option value="km">Километры</option><option value="m">Метры</option></select>
            <button class="convert-btn" onclick="runUnitConversion()">Конвертировать</button>
            <div id="unit-result" class="result">Результат</div>
        </div>

        <div id="history-section" class="converter-section">
            <button class="auth-btn" onclick="showMainMenu()"><i class="fas fa-chevron-left"></i> Назад</button>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>История</h2>
                <button onclick="clearAllHistory()" style="background:none; color:var(--error); border:none; cursor:pointer;"><i class="fas fa-trash"></i></button>
            </div>
            <div id="history-container" class="history-list"></div>
        </div>

        <div class="footer">
            <p class="made-by">Сделано <a href="https://neuron-p2p.ru" target="_blank">Neuron Ecosystem</a></p>
            <a href="https://t.me/neuron_ecosystem" class="telegram-link" target="_blank"><i class="fab fa-telegram"></i> Telegram</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOaDVzzPjyYm4HWMND2XYWjLy_h4wty5s",
            authDomain: "neuron-ecosystem-2025.firebaseapp.com",
            projectId: "neuron-ecosystem-2025",
            storageBucket: "neuron-ecosystem-2025.firebasestorage.app",
            messagingSenderId: "589834476565",
            appId: "1:589834476565:web:145d416afc673775dd421c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        window.saveToHistory = async (data) => {
            const entry = { ...data, date: new Date().toLocaleString(), ts: Date.now() };
            if (currentUser) {
                try { 
                    await addDoc(collection(db, "history"), { ...entry, uid: currentUser.uid }); 
                } catch (e) { console.error("Ошибка сохранения Firestore:", e); }
            } else {
                let local = JSON.parse(localStorage.getItem('neuron_hist') || '[]');
                local.unshift(entry);
                localStorage.setItem('neuron_hist', JSON.stringify(local.slice(0, 30)));
            }
        };

        window.loadHistory = async () => {
            const container = document.getElementById('history-container');
            if(!container) return;
            container.innerHTML = '<p style="text-align:center;">Загрузка...</p>';
            let list = [];

            if (currentUser) {
                try {
                    const q = query(collection(db, "history"), where("uid", "==", currentUser.uid), orderBy("ts", "desc"), limit(20));
                    const snap = await getDocs(q);
                    snap.forEach(doc => list.push(doc.data()));
                } catch (e) { console.error("Ошибка загрузки Firestore:", e); }
            } else {
                list = JSON.parse(localStorage.getItem('neuron_hist') || '[]');
            }

            container.innerHTML = list.length ? '' : '<p style="text-align:center; color:gray;">История пуста</p>';
            list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<div class="history-info"><strong>${item.type}</strong><p>${item.text}</p></div><div class="history-date">${item.date}</div>`;
                container.appendChild(div);
            });
        };

        onAuthStateChanged(auth, user => {
            currentUser = user;
            const trigger = document.getElementById('login-trigger');
            const info = document.getElementById('user-info');
            if (user) {
                trigger.style.display = 'none';
                info.style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('user-avatar').src = user.photoURL || `https://ui-avatars.com/api/?name=${user.email}`;
                window.loadHistory(); // Авто-подгрузка при входе
            } else {
                trigger.style.display = 'flex';
                info.style.display = 'none';
            }
        });

        document.getElementById('google-auth').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).then(() => document.getElementById('auth-modal').style.display='none');
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => { currentUser = null; window.loadHistory(); });
        document.getElementById('submit-auth').onclick = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try { await signInWithEmailAndPassword(auth, email, pass); document.getElementById('auth-modal').style.display='none'; } 
            catch(e) { document.getElementById('auth-error').innerText = "Ошибка входа"; document.getElementById('auth-error').style.display='block'; }
        };
    </script>

    <script>
        function showMainMenu() {
            document.querySelectorAll('.converter-section').forEach(s => s.classList.remove('section-active'));
            document.getElementById('main-menu').style.display = 'block';
        }

        function showSection(id) {
            document.getElementById('main-menu').style.display = 'none';
            const target = id === 'history' ? 'history-section' : (id === 'currency' ? 'currency-converter' : 'units-converter');
            document.getElementById(target).classList.add('section-active');
            if(id === 'history' && window.loadHistory) window.loadHistory();
        }

        document.getElementById('convert-btn').onclick = async () => {
            const amt = document.getElementById('amount').value;
            const from = document.getElementById('from-currency').value;
            const to = document.getElementById('to-currency').value;
            try {
                const res = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
                const data = await res.json();
                const str = `${amt} ${from} = ${(amt * data.rates[to]).toFixed(2)} ${to}`;
                document.getElementById('result').innerText = str;
                if(window.saveToHistory) window.saveToHistory({ type: 'Валюта', text: str });
            } catch(e) { }
        };

        window.runUnitConversion = () => {
            const val = document.getElementById('unit-amount').value;
            const f = document.getElementById('from-unit').value;
            const t = document.getElementById('to-unit').value;
            let res = (f === 'm' && t === 'km') ? val/1000 : (f === 'km' && t === 'm') ? val*1000 : val;
            const str = `${val} ${f} = ${res} ${t}`;
            document.getElementById('unit-result').innerText = str;
            if(window.saveToHistory) window.saveToHistory({ type: 'Длина', text: str });
        };

        const currs = ["USD", "EUR", "RUB", "CNY"];
        currs.forEach(c => {
            document.getElementById('from-currency').innerHTML += `<option value="${c}">${c}</option>`;
            document.getElementById('to-currency').innerHTML += `<option value="${c}">${c}</option>`;
        });
        document.getElementById('from-currency').value = "USD"; document.getElementById('to-currency').value = "RUB";

        document.getElementById('login-trigger').onclick = () => document.getElementById('auth-modal').style.display = 'flex';
        document.getElementById('close-modal').onclick = () => document.getElementById('auth-modal').style.display = 'none';

        function clearAllHistory() {
            localStorage.removeItem('neuron_hist');
            if(window.loadHistory) window.loadHistory();
        }
    </script>
</body>
</html>
