<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="google-site-verification" content="S4yj26laybYjHTBWA5u_2ey7dSgZ4F_5I22864VlCMU" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Converter | Neuron Ecosystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f0f23;
            --card-bg: #1a1b2e;
            --text: #ffffff;
            --text-secondary: #a0a0c0;
            --accent: #8b5cf6;
            --error: #ef4444;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Auth UI */
        .auth-header { position: absolute; top: 1rem; right: 1rem; z-index: 100; }
        .auth-btn {
            background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem;
            border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .auth-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        #user-info { display: none; align-items: center; gap: 1rem; background: rgba(255,255,255,0.05); padding: 0.5rem 1rem; border-radius: 50px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--primary); }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--card-bg); padding: 2.5rem; border-radius: 20px;
            width: 100%; max-width: 400px; position: relative; border: 1px solid rgba(255,255,255,0.1);
        }
        .close-modal { position: absolute; top: 1rem; right: 1rem; color: var(--text-secondary); cursor: pointer; font-size: 1.5rem; }
        .auth-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .auth-tab { padding: 0.5rem 1rem; cursor: pointer; color: var(--text-secondary); }
        .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .google-login-btn {
            width: 100%; padding: 0.8rem; background: white; color: #000; border: none;
            border-radius: 8px; margin-bottom: 1.5rem; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 0.5rem; font-weight: 600;
        }

        /* History Styles */
        .history-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .history-item {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;
            border-left: 4px solid var(--primary); display: flex; justify-content: space-between; align-items: center;
        }
        .history-date { font-size: 0.8rem; color: var(--text-secondary); }

        /* General UI */
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        .header { text-align: center; margin-bottom: 3rem; animation: fadeInUp 1s ease; }
        .logo { font-size: 4rem; margin-bottom: 1rem; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: float 3s ease-in-out infinite; }
        .nav-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; margin: 3rem 0; }
        .nav-btn {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px;
            padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.3s ease;
            text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; gap: 0.8rem;
        }
        .nav-btn:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3); }
        .nav-icon { font-size: 2rem; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .converter-section { background: var(--card-bg); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid rgba(255,255,255,0.1); display: none; }
        .section-active { display: block; animation: fadeInUp 0.5s ease; }
        input, select { width: 100%; padding: 1rem; background: #fff; border: 1px solid #ddd; border-radius: 10px; color: #000; margin-top: 5px; }
        .convert-btn { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin: 15px 0; }
        .result { background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 15px; text-align: center; font-size: 1.2rem; border: 1px solid rgba(255,255,255,0.1); }
        .error-msg { color: var(--error); font-size: 0.8rem; margin-top: 0.5rem; display: none; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div id="particles" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1;"></div>

    <div class="auth-header">
        <button id="login-trigger" class="auth-btn"><i class="fas fa-sign-in-alt"></i> Вход</button>
        <div id="user-info">
            <img src="" id="user-avatar" class="user-avatar">
            <span id="user-name"></span>
            <button id="logout-btn" class="auth-btn"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login">Вход</div>
                <div class="auth-tab" id="tab-register">Регистрация</div>
            </div>
            <button class="google-login-btn" id="google-auth">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google
            </button>
            <input type="email" id="auth-email" placeholder="Email" style="margin-bottom:10px">
            <input type="password" id="auth-password" placeholder="Пароль">
            <button class="convert-btn" id="submit-auth">Войти</button>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <div class="container">
        <div id="main-menu">
            <div class="header">
                <div class="logo"><i class="fas fa-exchange-alt"></i></div>
                <h1>Neuron Converter</h1>
            </div>
            <div class="nav-buttons">
                <div class="nav-btn" onclick="showSection('currency')"><i class="fas fa-money-bill-wave nav-icon"></i><span>Валюты</span></div>
                <div class="nav-btn" onclick="showSection('units')"><i class="fas fa-ruler-combined nav-icon"></i><span>Единицы</span></div>
                <div class="nav-btn" onclick="showSection('history')"><i class="fas fa-history nav-icon"></i><span>История</span></div>
                <a href="http://neuron-p2p.ru/" class="nav-btn"><i class="fas fa-home nav-icon"></i><span>Портал</span></a>
            </div>
        </div>

        <div id="currency-converter" class="converter-section">
            <button class="auth-btn" onclick="showMainMenu()">Назад</button>
            <h2>Конвертер валют</h2>
            <input type="number" id="amount" placeholder="Сумма">
            <select id="from-currency"></select>
            <select id="to-currency"></select>
            <button class="convert-btn" id="convert-btn">Конвертировать</button>
            <div id="result" class="result">Результат</div>
        </div>

        <div id="units-converter" class="converter-section">
            <button class="auth-btn" onclick="showMainMenu()">Назад</button>
            <h2>Конвертер единиц (Длина)</h2>
            <input type="number" id="length-amount" placeholder="Значение">
            <select id="from-length"><option value="m">Метры</option><option value="km">Км</option></select>
            <select id="to-length"><option value="m">Метры</option><option value="km">Км</option></select>
            <button class="convert-btn" onclick="runUnitConversion()">Конвертировать</button>
            <div id="unit-result" class="result">Результат</div>
        </div>

        <div id="history-section" class="converter-section">
            <button class="auth-btn" onclick="showMainMenu()">Назад</button>
            <h2>История операций</h2>
            <div id="history-container" class="history-list">
                </div>
            <button class="auth-btn" onclick="clearHistoryUI()" style="margin-top:20px; background: var(--error)">Очистить историю</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, orderBy, limit, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOaDVzzPjyYm4HWMND2XYWjLy_h4wty5s",
            authDomain: "neuron-ecosystem-2025.firebaseapp.com",
            projectId: "neuron-ecosystem-2025",
            storageBucket: "neuron-ecosystem-2025.firebasestorage.app",
            messagingSenderId: "589834476565",
            appId: "1:589834476565:web:145d416afc673775dd421c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        // --- Логика Истории ---
        async function saveToHistory(data) {
            const historyEntry = {
                ...data,
                date: new Date().toLocaleString(),
                timestamp: Date.now()
            };

            if (currentUser) {
                // Сохранение в Firebase
                try {
                    await addDoc(collection(db, "history"), {
                        ...historyEntry,
                        userId: currentUser.uid
                    });
                } catch (e) { console.error("Firebase save error", e); }
            } else {
                // Сохранение в Local Storage
                let localHistory = JSON.parse(localStorage.getItem('neuron_history') || '[]');
                localHistory.unshift(historyEntry);
                localStorage.setItem('neuron_history', JSON.stringify(localHistory.slice(0, 50))); // Храним последние 50
            }
        }

        async function loadHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = 'Загрузка...';
            let historyData = [];

            if (currentUser) {
                const q = query(collection(db, "history"), where("userId", "==", currentUser.uid), orderBy("timestamp", "desc"), limit(20));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach(doc => historyData.push(doc.data()));
            } else {
                historyData = JSON.parse(localStorage.getItem('neuron_history') || '[]');
            }

            container.innerHTML = historyData.length ? '' : 'История пуста';
            historyData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div>
                        <strong>${item.type}</strong><br>
                        <span>${item.text}</span>
                    </div>
                    <div class="history-date">${item.date}</div>
                `;
                container.appendChild(div);
            });
        }

        window.clearHistoryUI = () => {
            if(!currentUser) {
                localStorage.removeItem('neuron_history');
                loadHistory();
            } else {
                alert("Удаление из облака пока недоступно в этой версии");
            }
        }

        // --- Firebase Auth ---
        onAuthStateChanged(auth, user => {
            currentUser = user;
            if (user) {
                document.getElementById('login-trigger').style.display = 'none';
                document.getElementById('user-info').style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName || user.email;
                document.getElementById('user-avatar').src = user.photoURL || `https://ui-avatars.com/api/?name=${user.email}`;
            } else {
                document.getElementById('login-trigger').style.display = 'block';
                document.getElementById('user-info').style.display = 'none';
            }
        });

        document.getElementById('google-auth').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).then(() => document.getElementById('auth-modal').style.display='none');
        document.getElementById('logout-btn').onclick = () => signOut(auth);
        document.getElementById('submit-auth').onclick = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                document.getElementById('auth-modal').style.display='none';
            } catch(e) { document.getElementById('auth-error').innerText = e.message; document.getElementById('auth-error').style.display='block'; }
        };

        // Экспонируем функции для старого кода
        window.saveToHistory = saveToHistory;
        window.loadHistory = loadHistory;
    </script>

    <script>
        // --- Логика приложения (старый код + интеграция истории) ---
        function showMainMenu() {
            document.querySelectorAll('.converter-section').forEach(s => s.classList.remove('section-active'));
            document.getElementById('main-menu').style.display = 'block';
        }

        function showSection(id) {
            document.getElementById('main-menu').style.display = 'none';
            const target = id === 'history' ? 'history-section' : (id === 'currency' ? 'currency-converter' : 'units-converter');
            document.getElementById(target).classList.add('section-active');
            if(id === 'history') window.loadHistory();
        }

        // Валюты
        document.getElementById('convert-btn').onclick = async () => {
            const amt = document.getElementById('amount').value;
            const from = document.getElementById('from-currency').value;
            const to = document.getElementById('to-currency').value;
            if(!amt) return;

            try {
                const res = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
                const data = await res.json();
                const result = (amt * data.rates[to]).toFixed(2);
                const text = `${amt} ${from} → ${result} ${to}`;
                document.getElementById('result').innerText = text;
                
                // СОХРАНЕНИЕ В ИСТОРИЮ
                window.saveToHistory({ type: 'Валюта', text: text });
            } catch(e) { alert("Ошибка сети"); }
        };

        // Единицы
        window.runUnitConversion = () => {
            const val = document.getElementById('length-amount').value;
            const from = document.getElementById('from-length').value;
            const to = document.getElementById('to-length').value;
            let res = val;
            if(from === 'm' && to === 'km') res = val / 1000;
            if(from === 'km' && to === 'm') res = val * 1000;
            
            const text = `${val} ${from} → ${res} ${to}`;
            document.getElementById('unit-result').innerText = text;
            
            // СОХРАНЕНИЕ В ИСТОРИЮ
            window.saveToHistory({ type: 'Единицы', text: text });
        };

        // Инициализация выпадающих списков
        const curr = ["USD", "EUR", "RUB", "CNY"];
        const selFrom = document.getElementById('from-currency');
        const selTo = document.getElementById('to-currency');
        curr.forEach(c => {
            selFrom.innerHTML += `<option value="${c}">${c}</option>`;
            selTo.innerHTML += `<option value="${c}">${c}</option>`;
        });

        // Модалка
        document.getElementById('login-trigger').onclick = () => document.getElementById('auth-modal').style.display = 'flex';
        document.getElementById('close-modal').onclick = () => document.getElementById('auth-modal').style.display = 'none';
    </script>
</body>
</html>
